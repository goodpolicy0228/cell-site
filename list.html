<div id="site-nav"></div>
<main>
<div class="crumb-bar"><div class="wrap"><nav class="crumb" aria-label="パンくず"><a href="index.html">表紙</a><span>／</span><span>04 全品目</span></nav></div></div><section id="list" style="padding-top:56px">
  <div class="wrap">
    <p class="eyebrow">04 ｜ 全品目一覧</p>
    <h2 class="sec-title">148件の品目すべて</h2>
    <p class="sec-lead">報告書の品目表（第8章7節）を、国・状態・領域で絞り込めます。出典IDは報告書の章別出典番号です（S01〜S08）。</p>

    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="品目名・対象疾患で検索（例：CAR-T、パーキンソン）" aria-label="品目を検索">
      <div class="chips" id="fCountry" role="group" aria-label="国・地域"></div>
      <div class="chips" id="fStatus" role="group" aria-label="状態"></div>
      <div class="chips" id="fChapter" role="group" aria-label="領域"></div>
    </div>
    <p class="count" id="count"></p>

    <div id="groups"></div>
    <div class="empty" id="empty">条件に合う品目はありません。絞り込みを解除してください。</div>

    <div class="legend-status">
      <span><i class="sw seg-A"></i>承認（確認済み）</span>
      <span><i class="sw seg-U"></i>承認（未確認）</span>
      <span><i class="sw seg-T"></i>治験中</span>
      <span><i class="sw seg-D"></i>中止・中断</span>
      <span><i class="sw seg-R"></i>取消・失効</span>
      <span><i class="sw seg-N"></i>未承認・申請中</span>
    </div>
    <p class="note">「未確認」は、その国で未承認であることを意味しません。情報が得られなかったことを示します。CIK療法の注記（中国で154件、世界199件の治験のうち）は表に含めていません。</p>
  </div>
</section>
